<style id="app-style">
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Pretendard Variable', sans-serif; background: #0A0A0C; color: #EDEDEF; min-height: 100vh; }
:root {
  --current-bg: #141414;
  --current-fg: #F4E5D9;
  --current-accent: #DA7756;
  --current-muted: #8B8B92;
  --current-line: #26262c;
}

/* ===== Task 8: Header ===== */
#app-header {
  padding: 32px 32px 24px;
  border-bottom: 1px solid #26262c;
  background: linear-gradient(180deg, rgba(218,119,86,0.08), transparent);
}
.h-title {
  font-size: 32px; font-weight: 900; letter-spacing: -0.03em;
  background: linear-gradient(90deg, #DA7756, #00F5A0, #FF0080);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.h-sub { color: #8B8B92; font-size: 13px; margin-top: 4px; }
.h-pill { display:inline-block; padding:3px 10px; border-radius:999px; background:#00F5A0; color:#000; font-size:11px; font-weight:800; margin-right:6px; }

/* ===== Task 9: 3-Panel Layout ===== */
#app-main {
  display: grid;
  grid-template-columns: 240px 1fr 400px;
  gap: 20px;
  padding: 20px;
  min-height: calc(100vh - 120px);
}
#panel-left, #panel-right {
  background: #18181c; border:1px solid #26262c; border-radius:14px; padding:18px;
  position:sticky; top:20px;
  max-height: calc(100vh - 40px); overflow-y: auto;
}
/* compact palette chips so motion list is visible without scrolling the panel */
#panel-left .p-chip-swatch { height: 24px; }
#panel-left .p-chip-info { padding: 4px 6px; }
#panel-left .p-chip-name { font-size: 10px; }
#panel-left .palette-chips { gap: 6px; margin-bottom: 16px; }
#panel-center { padding:0; }

/* ===== Task 10: Palette Chips ===== */
.section-title { font-size:11px; font-weight:800; letter-spacing:1px; color:#00F5A0; text-transform:uppercase; margin: 4px 0 12px; }
.palette-chips { display:grid; grid-template-columns: repeat(2, 1fr); gap:8px; margin-bottom: 24px; }
.p-chip { cursor:pointer; border-radius:8px; overflow:hidden; border:2px solid transparent; transition: transform 0.15s, border-color 0.15s; }
.p-chip:hover { transform: translateY(-2px); border-color:#26262c; }
.p-chip.selected { border-color:#00F5A0; }
.p-chip-swatch { display:flex; height: 32px; }
.p-chip-swatch > div { flex:1; }
.p-chip-info { padding: 6px 8px; background:#0A0A0C; }
.p-chip-code { font-family:'Space Mono',monospace; font-size:9px; color:#8B8B92; }
.p-chip-name { font-size:11px; font-weight:800; color:#EDEDEF; }

/* ===== Task 11: Motion List ===== */
.motion-list { max-height: 400px; overflow-y:auto; border-top:1px solid #26262c; padding-top: 12px; }
.m-item { display:flex; align-items:center; padding:6px 8px; cursor:pointer; border-radius:6px; font-size:11px; gap:6px; }
.m-item:hover { background:#0A0A0C; }
.m-item.selected { background:#00F5A0; color:#000; font-weight:800; }
.m-id { font-family:'Space Mono',monospace; font-size:10px; min-width: 30px; color:#8B8B92; }
.m-item.selected .m-id { color:#000; }
.m-name { flex:1; }
.m-rank { font-size:10px; padding:1px 6px; border-radius:999px; background:#FFD166; color:#000; font-weight:800; }
.m-rank.r2 { background:#90E0EF; }
.m-rank.r3 { background:#26262c; color:#8B8B92; }
.m-cat { font-size:9px; color:#8B8B92; padding: 8px 0 4px; text-transform:uppercase; letter-spacing:0.5px; }

/* ===== Task 12: Preset Grid ===== */
#panel-center { display:flex; flex-direction: column; gap: 32px; }
.preset-section { padding: 0 8px; }
.preset-section h2 { font-size: 18px; font-weight: 900; color:#EDEDEF; margin-bottom: 4px; letter-spacing:-0.02em; }
.preset-section .ps-desc { color:#8B8B92; font-size:12px; margin-bottom: 14px; }
.preset-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap:14px; }
.preset-card { background:#18181c; border:2px solid #26262c; border-radius:12px; overflow:hidden; cursor:pointer; transition: transform 0.15s, border-color 0.15s; }
.preset-card:hover { border-color:#3a3a44; transform: translateY(-2px); }
.preset-card.selected { border-color:#00F5A0; }
.pc-mark { aspect-ratio: 1; background: var(--current-bg); color: var(--current-fg); display:flex; align-items:center; justify-content:center; padding:14px; transition: background 200ms ease, color 200ms ease; overflow:hidden; position:relative; }
.pc-info { padding: 10px 12px 12px; background:#0A0A0C; }
.pc-id { font-family:'Space Mono',monospace; font-size:9px; color:#8B8B92; }
.pc-name { font-size:13px; font-weight:800; color:#EDEDEF; }
.pc-desc { font-size:10px; color:#8B8B92; margin-top:2px; line-height:1.3; }

/* ===== Task 13: Classic Mini-Marks (1~10) ===== */
.mm-hero-bold { font-size: 56px; font-weight: 900; line-height: 0.9; color: var(--current-fg); letter-spacing:-0.04em; text-align:center; }
.mm-hero-bold span { color: var(--current-accent); }
.mm-list-card { display:flex; flex-direction:column; gap:6px; width:100%; }
.mm-list-card .mli { display:flex; gap:8px; align-items:center; padding: 6px 8px; background: rgba(255,255,255,0.05); border-radius:4px; font-size:10px; color: var(--current-fg); }
.mm-list-card .mli b { color: var(--current-accent); font-family:'Space Mono',monospace; }
.mm-quote-center { text-align:center; }
.mm-quote-center .q { font-family: serif; color: var(--current-accent); font-size: 64px; line-height: 0.5; font-weight: 900; }
.mm-quote-center .t { font-size: 12px; color: var(--current-fg); margin-top: 16px; font-style: italic; }
.mm-stat-focus { text-align:center; }
.mm-stat-focus .num { font-size: 80px; font-weight: 900; color: var(--current-accent); line-height: 1; letter-spacing:-0.05em; }
.mm-stat-focus .lbl { font-size: 10px; color: var(--current-fg); text-transform:uppercase; letter-spacing:1px; }
.mm-photo-frame { width:100%; height:100%; display:flex; flex-direction:column; }
.mm-photo-frame .ph { flex:2; background: linear-gradient(135deg, var(--current-accent), var(--current-muted)); }
.mm-photo-frame .tx { flex:1; background: var(--current-bg); padding:8px; font-size:10px; font-weight:800; color: var(--current-fg); display:flex; align-items:center; }
.mm-editorial { padding: 12px 0; border-top: 1px solid var(--current-line); border-bottom: 1px solid var(--current-line); width:100%; text-align:center; }
.mm-editorial .ed-num { font-family: serif; font-size:11px; color: var(--current-accent); margin-bottom:6px; letter-spacing:2px; }
.mm-editorial .ed-t { font-family: serif; font-size: 22px; font-weight: 900; color: var(--current-fg); line-height: 1.1; }
.mm-grid-poster { display:grid; grid-template-columns: repeat(2,1fr); grid-template-rows: repeat(2,1fr); gap:4px; width:100%; height:100%; }
.mm-grid-poster > div { background: var(--current-accent); border-radius:2px; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:900; color: var(--current-bg); }
.mm-grid-poster > div:nth-child(2) { background: var(--current-fg); color: var(--current-bg); }
.mm-grid-poster > div:nth-child(3) { background: var(--current-muted); }
.mm-split-screen { display:flex; width:100%; height:100%; }
.mm-split-screen > div { flex:1; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:14px; }
.mm-split-screen .l { background: var(--current-accent); color: var(--current-bg); }
.mm-split-screen .r { background: var(--current-fg); color: var(--current-bg); }
.mm-headline-news { width:100%; }
.mm-headline-news .tag { display:inline-block; padding: 2px 6px; background: var(--current-accent); color: var(--current-bg); font-size:8px; font-weight:900; letter-spacing:1px; }
.mm-headline-news .h { font-family: serif; font-size: 22px; font-weight: 900; line-height: 1; color: var(--current-fg); margin-top: 6px; }
.mm-headline-news .sub { font-size:9px; color: var(--current-muted); margin-top:6px; line-height:1.3; }
.mm-checklist { display:flex; flex-direction:column; gap:6px; width:100%; }
.mm-checklist .ck { display:flex; align-items:center; gap:8px; font-size:11px; color: var(--current-fg); }
.mm-checklist .ck::before { content:'☑'; color: var(--current-accent); font-weight:900; }

/* ===== Task 14: Trendy Mini-Marks (11~25) ===== */
.mm-neo-brutalism { padding:14px; background: var(--current-fg); color: var(--current-bg); font-weight:900; font-size:18px; border:3px solid var(--current-bg); box-shadow: 6px 6px 0 var(--current-accent); width:80%; }
.mm-risograph { background: var(--current-fg); position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
.mm-risograph::before, .mm-risograph::after { content:''; position:absolute; width:60%; height:60%; border-radius:50%; mix-blend-mode: multiply; opacity:0.7; }
.mm-risograph::before { background: var(--current-accent); top:10%; left:10%; }
.mm-risograph::after { background: var(--current-bg); top:25%; left:25%; }
.mm-risograph .t { position:relative; z-index:2; font-weight:900; color: var(--current-fg); mix-blend-mode: difference; font-size:14px; }
.mm-glass-morphism { background: linear-gradient(135deg, var(--current-accent), var(--current-bg)); width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
.mm-glass-morphism .glass { background: rgba(255,255,255,0.15); backdrop-filter: blur(8px); border:1px solid rgba(255,255,255,0.3); padding:12px 18px; border-radius:14px; color: var(--current-fg); font-weight:800; font-size:13px; }
.mm-y2k-chrome { background: linear-gradient(135deg, #c0c0c0, var(--current-accent), #ffffff); width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:22px; color: var(--current-bg); text-shadow: 0 2px 0 rgba(0,0,0,0.3); }
.mm-bauhaus { display:grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap:0; width:100%; height:100%; }
.mm-bauhaus > div:nth-child(1) { background: var(--current-accent); }
.mm-bauhaus > div:nth-child(2) { background: var(--current-fg); border-radius:0 0 100% 0; }
.mm-bauhaus > div:nth-child(3) { background: var(--current-fg); }
.mm-bauhaus > div:nth-child(4) { background: var(--current-bg); }
.mm-claymorphism { width:100%; height:100%; background: var(--current-fg); display:flex; align-items:center; justify-content:center; gap:8px; }
.mm-claymorphism .blob { width: 36px; height: 36px; border-radius: 50%; box-shadow: inset -3px -3px 6px rgba(0,0,0,0.2), inset 3px 3px 6px rgba(255,255,255,0.5); }
.mm-claymorphism .b1 { background: var(--current-accent); }
.mm-claymorphism .b2 { background: var(--current-muted); }
.mm-claymorphism .b3 { background: var(--current-bg); }
.mm-memphis { background: var(--current-fg); width:100%; height:100%; padding:10px; position:relative; display:flex; align-items:center; justify-content:center; }
.mm-memphis::before { content:''; position:absolute; top:8px; left:8px; width:14px; height:14px; background: var(--current-accent); }
.mm-memphis::after { content:''; position:absolute; bottom:8px; right:8px; width:18px; height:18px; border:3px solid var(--current-bg); border-radius:50%; }
.mm-memphis .t { font-weight:900; font-size:18px; color: var(--current-bg); }
.mm-vaporwave { background: linear-gradient(180deg, var(--current-accent) 0%, var(--current-bg) 100%); position:relative; width:100%; height:100%; overflow:hidden; }
.mm-vaporwave .grid { position:absolute; bottom:0; left:0; right:0; height:50%; background-image: linear-gradient(to right, var(--current-fg) 1px, transparent 1px), linear-gradient(to top, var(--current-fg) 1px, transparent 1px); background-size: 20px 20px; transform: perspective(60px) rotateX(45deg); transform-origin: bottom; opacity: 0.5; }
.mm-vaporwave .sun { position:absolute; top:20%; left:50%; transform:translateX(-50%); width:60px; height:60px; border-radius:50%; background: var(--current-fg); opacity:0.9; }
.mm-sticker-pop { background: var(--current-bg); width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
.mm-sticker-pop .sticker { background: var(--current-accent); color: var(--current-fg); padding: 10px 18px; border-radius:24px; border: 3px solid var(--current-fg); font-weight:900; font-size:18px; transform: rotate(-6deg); }
.mm-tape-label { background: var(--current-fg); padding: 14px; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
.mm-tape-label .tape { background: var(--current-accent); padding: 8px 16px; border-left: dashed 2px var(--current-bg); border-right: dashed 2px var(--current-bg); transform: rotate(-3deg); font-weight:900; font-size:14px; color: var(--current-bg); }
.mm-newspaper { background: var(--current-fg); padding: 14px; width:100%; height:100%; font-family: serif; color: var(--current-bg); }
.mm-newspaper .top { font-size: 9px; letter-spacing:3px; text-align:center; padding-bottom:6px; border-bottom: 1px solid var(--current-bg); }
.mm-newspaper .h { font-weight:900; font-size:14px; line-height:1.1; margin-top:6px; }
.mm-newspaper .body { font-size:8px; columns:2; column-gap:6px; margin-top:4px; line-height:1.2; }
.mm-retro-tv { background: var(--current-bg); border-radius:12px; padding:8px; width:100%; height:100%; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
.mm-retro-tv .screen { color: var(--current-accent); font-family:'Space Mono',monospace; font-weight:900; font-size:16px; }
.mm-retro-tv::after { content:''; position:absolute; inset:0; background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.2) 2px, rgba(0,0,0,0.2) 4px); pointer-events:none; }
.mm-zine { background: var(--current-fg); padding: 14px; width:100%; height:100%; position:relative; }
.mm-zine .t { font-family: serif; font-weight:900; font-size:24px; color: var(--current-bg); }
.mm-zine .stamp { background: var(--current-accent); display:inline-block; padding:2px 6px; font-size:10px; font-weight:800; transform: rotate(-4deg); margin-top:6px; }
.mm-polaroid { background: var(--current-fg); padding: 8px 8px 22px; border-radius:2px; box-shadow: 4px 4px 12px rgba(0,0,0,0.4); width: 70%; transform: rotate(-3deg); }
.mm-polaroid .pic { background: linear-gradient(135deg, var(--current-accent), var(--current-muted)); aspect-ratio: 1; border-radius:1px; }
.mm-polaroid .ph-cap { font-size:10px; text-align:center; padding-top:6px; color: var(--current-bg); font-family: serif; }
.mm-marker-sketch { background: var(--current-fg); padding: 14px; width:100%; height:100%; }
.mm-marker-sketch .h { font-weight:900; font-size:18px; color: var(--current-bg); border-bottom: 6px solid var(--current-accent); display:inline; padding-bottom:2px; line-height:1.4; }
.mm-marker-sketch .sub { font-size:11px; color: var(--current-bg); margin-top:8px; }

/* ===== Task 15: Typography Mini-Marks (26~33) ===== */
.mm-faux-3d-text { font-size: 48px; font-weight: 900; color: var(--current-accent); letter-spacing:-0.03em; line-height:1; text-shadow: 1px 1px 0 var(--current-fg), 2px 2px 0 var(--current-fg), 3px 3px 0 var(--current-fg), 4px 4px 0 var(--current-fg), 5px 5px 0 var(--current-bg); }
.mm-kinetic-typo { font-size: 28px; font-weight: 900; color: var(--current-fg); display:flex; gap:4px; }
.mm-kinetic-typo span { display:inline-block; }
.mm-kinetic-typo span:nth-child(1) { color: var(--current-accent); transform: translateY(-4px); }
.mm-kinetic-typo span:nth-child(2) { transform: translateY(2px); }
.mm-kinetic-typo span:nth-child(3) { color: var(--current-accent); transform: translateY(-2px); }
.mm-typewriter { font-family:'Space Mono',monospace; font-size: 20px; color: var(--current-fg); border-right: 3px solid var(--current-accent); padding-right: 4px; }
.mm-outline-text { font-size: 56px; font-weight: 900; color: transparent; -webkit-text-stroke: 2px var(--current-fg); letter-spacing:-0.04em; }
.mm-graffiti { font-family: 'Impact', sans-serif; font-size: 36px; font-weight: 900; color: var(--current-accent); transform: skew(-8deg); text-shadow: 3px 3px 0 var(--current-bg); }
.mm-serif-mono { text-align:center; }
.mm-serif-mono .a { font-family: serif; font-size:32px; font-weight:900; color: var(--current-fg); font-style:italic; }
.mm-serif-mono .b { font-family:'Space Mono',monospace; font-size:11px; color: var(--current-accent); margin-top:4px; letter-spacing:2px; }
.mm-stamp-text { display:inline-block; padding: 10px 18px; border: 4px solid var(--current-accent); color: var(--current-accent); font-weight:900; font-size:20px; transform: rotate(-6deg); letter-spacing:2px; opacity:0.85; }
.mm-ransom-note { display:flex; gap:2px; flex-wrap:wrap; justify-content:center; }
.mm-ransom-note span { padding: 4px 6px; font-weight:900; font-size: 18px; line-height:1; }
.mm-ransom-note span:nth-child(1) { background: var(--current-accent); color: var(--current-bg); transform: rotate(-4deg); }
.mm-ransom-note span:nth-child(2) { background: var(--current-fg); color: var(--current-bg); transform: rotate(2deg); }
.mm-ransom-note span:nth-child(3) { background: var(--current-bg); color: var(--current-fg); border:1px solid var(--current-fg); transform: rotate(-2deg); }
.mm-ransom-note span:nth-child(4) { background: var(--current-muted); color: var(--current-bg); transform: rotate(3deg); }

/* ===== Task 16: Data Mini-Marks (42~50) ===== */
.mm-infographic { display:flex; gap:12px; align-items:center; }
.mm-infographic .ico { width:48px; height:48px; border-radius:50%; background: var(--current-accent); display:flex; align-items:center; justify-content:center; font-size:22px; color: var(--current-bg); }
.mm-infographic .v { font-size: 32px; font-weight:900; color: var(--current-fg); }
.mm-infographic .l { font-size:9px; color: var(--current-muted); letter-spacing:1px; text-transform:uppercase; }
.mm-timeline { width:100%; }
.mm-timeline .line { height:2px; background: var(--current-accent); position:relative; margin: 16px 0; }
.mm-timeline .dot { position:absolute; top:-4px; width:10px; height:10px; border-radius:50%; background: var(--current-accent); border: 2px solid var(--current-bg); }
.mm-timeline .lbl { position:absolute; top:8px; font-size:9px; color: var(--current-fg); transform: translateX(-50%); white-space:nowrap; }
.mm-comparison-table { display:flex; gap:6px; width:100%; }
.mm-comparison-table > div { flex:1; padding:10px; border-radius:6px; text-align:center; }
.mm-comparison-table .a { background: var(--current-fg); color: var(--current-bg); font-weight:800; font-size:14px; }
.mm-comparison-table .vs { flex:0 0 auto; padding:10px 4px; color: var(--current-accent); font-weight:900; }
.mm-comparison-table .b { background: var(--current-accent); color: var(--current-bg); font-weight:800; font-size:14px; }
.mm-bar-chart { display:flex; align-items:flex-end; gap:6px; width:100%; height:80%; }
.mm-bar-chart > div { flex:1; background: var(--current-accent); border-radius:2px 2px 0 0; }
.mm-donut-chart { width:100px; height:100px; border-radius:50%; background: conic-gradient(var(--current-accent) 0% 70%, var(--current-muted) 70% 100%); display:flex; align-items:center; justify-content:center; position:relative; }
.mm-donut-chart::before { content:''; position:absolute; inset:18px; background: var(--current-bg); border-radius:50%; }
.mm-donut-chart .pct { position:relative; z-index:2; font-size:18px; font-weight:900; color: var(--current-fg); }
.mm-flow-diagram { display:flex; align-items:center; gap:6px; }
.mm-flow-diagram .node { padding: 6px 10px; border:1.5px solid var(--current-accent); border-radius:4px; color: var(--current-fg); font-weight:800; font-size:11px; }
.mm-flow-diagram .arrow { color: var(--current-accent); font-weight:900; }
.mm-mind-map { width:100%; height:100%; position:relative; }
.mm-mind-map .center { position:absolute; left:50%; top:50%; transform: translate(-50%,-50%); padding:6px 10px; background: var(--current-accent); color: var(--current-bg); border-radius:4px; font-weight:800; font-size:11px; }
.mm-mind-map .leaf { position:absolute; padding:3px 6px; background: var(--current-fg); color: var(--current-bg); font-size:9px; border-radius:3px; font-weight:700; }
.mm-mind-map .leaf.l1 { top:10%; left:10%; }
.mm-mind-map .leaf.l2 { top:10%; right:10%; }
.mm-mind-map .leaf.l3 { bottom:10%; left:10%; }
.mm-mind-map .leaf.l4 { bottom:10%; right:10%; }
.mm-ranking-list { width:100%; display:flex; flex-direction:column; gap:4px; }
.mm-ranking-list .row { display:flex; gap:8px; align-items:center; padding: 4px 6px; background: rgba(255,255,255,0.05); border-radius:3px; font-size:10px; color: var(--current-fg); }
.mm-ranking-list .rk { font-weight:900; font-family:'Space Mono',monospace; color: var(--current-accent); min-width:18px; }
.mm-before-after { display:flex; width:100%; height:100%; border:2px solid var(--current-line); }
.mm-before-after > div { flex:1; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:11px; }
.mm-before-after .b { background: var(--current-muted); color: var(--current-bg); }
.mm-before-after .a { background: var(--current-accent); color: var(--current-bg); }

/* ===== Task 17: Novelty Mini-Marks (57~64) ===== */
.mm-holographic { width:100%; height:100%; background: linear-gradient(135deg, #ff0080, #ff8c00, #40e0d0, #ff0080); background-size: 200% 200%; animation: holoshift 4s ease infinite; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:18px; color:#fff; mix-blend-mode: difference; }
@keyframes holoshift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
.mm-liquid-metal { width:100%; height:100%; background: radial-gradient(ellipse at 30% 30%, #fff, var(--current-accent), var(--current-bg)); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:18px; color: var(--current-fg); }
.mm-aurora { width:100%; height:100%; background: linear-gradient(135deg, var(--current-accent) 0%, var(--current-fg) 50%, var(--current-bg) 100%); background-size: 200% 200%; animation: holoshift 6s ease infinite; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:18px; color: var(--current-bg); text-shadow: 0 0 8px rgba(0,0,0,0.5); }
.mm-neon-sign { background: var(--current-bg); width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
.mm-neon-sign .t { color: var(--current-accent); font-size:22px; font-weight:900; text-shadow: 0 0 4px var(--current-accent), 0 0 8px var(--current-accent), 0 0 14px var(--current-accent); }
.mm-crystal-facet { width:0; height:0; border-left: 60px solid transparent; border-right: 60px solid transparent; border-bottom: 90px solid var(--current-accent); position:relative; filter: drop-shadow(0 0 6px var(--current-accent)); }
.mm-shader-mesh { width:100%; height:100%; background: conic-gradient(from 0deg, var(--current-accent), var(--current-fg), var(--current-bg), var(--current-accent)); filter: blur(4px); }
.mm-ai-dream { width:100%; height:100%; background: radial-gradient(ellipse at 50% 30%, var(--current-fg), var(--current-accent) 40%, var(--current-bg)); filter: blur(2px) saturate(1.5); display:flex; align-items:center; justify-content:center; font-weight:900; color: rgba(255,255,255,0.7); font-size:14px; }
.mm-data-matrix { background: var(--current-bg); width:100%; height:100%; padding: 8px; font-family:'Space Mono',monospace; color: var(--current-accent); font-size:9px; line-height:1.1; overflow:hidden; word-break:break-all; }

/* ===== Task 18: Right Panel ===== */
/* Sprint 8: Slot toggle (커버/내용/CTA) */
.slot-toggle { background:#0A0A0C; border:1px solid #26262c; border-radius:10px; padding:12px 14px; margin-bottom:14px; }
.slot-toggle-label { font-size:10px; color:#8B8B92; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; font-weight:700; }
.slot-toggle-buttons { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
.slot-btn { background:#18181c; border:2px solid #26262c; color:#EDEDEF; padding:8px 6px; border-radius:6px; cursor:pointer; font-family:inherit; font-weight:700; font-size:12px; transition: all .15s; display:flex; flex-direction:column; align-items:center; gap:4px; }
.slot-btn:hover { border-color:#3a3a44; }
.slot-btn.active { background:rgba(0,245,160,0.1); border-color:#00F5A0; color:#00F5A0; }
.slot-btn-id { font-family:'Space Mono',monospace; font-size:9px; color:#8B8B92; font-weight:400; letter-spacing:-0.3px; }
.slot-btn.active .slot-btn-id { color:#00F5A0; opacity:0.8; }

/* Sprint 8: 5-row combo display */
.combo-display { background:#0A0A0C; border:1px solid #26262c; border-radius:8px; padding:10px 12px; margin-bottom:14px; }
.combo-row { display:flex; justify-content:space-between; align-items:center; padding:4px 0; border-bottom:1px solid #18181c; font-size:12px; }
.combo-row:last-child { border-bottom:none; }
.combo-label { color:#8B8B92; font-size:10px; text-transform:uppercase; letter-spacing:1px; }
.combo-value { font-family:'Space Mono',monospace; color:#00F5A0; font-weight:700; }
.combo-row.slot-row .combo-value { color:#EDEDEF; }
.combo-row.slot-row.active .combo-label { color:#00F5A0; }
.combo-row.slot-row.active .combo-value { color:#00F5A0; }

/* Sprint 8: Active slot banner above preset grid */
.active-slot-banner { background: rgba(0,245,160,0.08); border:1px solid rgba(0,245,160,0.3); border-radius:8px; padding:10px 16px; margin: 0 8px 16px; font-size: 12px; color:#EDEDEF; }
.active-slot-banner b { color:#00F5A0; }
.prompt-area { display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
.prompt-area label { font-size:11px; color:#8B8B92; font-weight:800; letter-spacing:0.5px; }
.prompt-area textarea { width:100%; min-height:140px; background:#0A0A0C; color:#EDEDEF; border:1px solid #26262c; border-radius:8px; padding:12px; font-family: 'Pretendard Variable', sans-serif; font-size: 12px; line-height:1.5; resize: vertical; }
.prompt-area textarea:focus { outline:none; border-color:#00F5A0; }
.btn-row { display:flex; gap:8px; margin-bottom:18px; }
.btn { flex:1; padding: 10px 12px; border-radius:8px; border:none; font-weight:800; cursor:pointer; font-size:12px; font-family:inherit; }
.btn-apply { background: #00F5A0; color: #000; }
.btn-apply:hover { background: #00d68a; }
.btn-copy { background: #26262c; color:#EDEDEF; }
.btn-copy:hover { background: #3a3a44; }
.btn-copy.copied { background: #00F5A0; color:#000; }
.preview-mount { background:#0A0A0C; border:1px solid #26262c; border-radius:8px; padding:8px; }
.preview-mount .pv-lbl { font-size:10px; color:#8B8B92; padding:4px 6px 8px; letter-spacing:1px; text-transform:uppercase; }
.preview-canvas { aspect-ratio: var(--preview-aspect, 1/1); background: var(--current-bg); color: var(--current-fg); border-radius:6px; padding: 16px; box-sizing: border-box; display:flex; align-items:center; justify-content:center; overflow:hidden; transition: background 200ms ease, color 200ms ease, aspect-ratio 250ms ease; }

/* ===== Sprint 6: Motion Demo System ===== */
.m-demo-icon { font-size: 9px; opacity: 0.7; margin-right: 2px; }
.m-item.selected .m-demo-icon { opacity: 1; }

.preview-content { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
/* ===== 비율 토글 (1:1 / 4:5 / 9:16 / 16:9) ===== */
.aspect-toggle { margin-bottom: 16px; }
.aspect-buttons { display:grid; grid-template-columns: repeat(4, 1fr); gap:4px; }
.aspect-btn { background:#0A0A0C; border:1.5px solid #26262c; color:#EDEDEF; padding:8px 4px; border-radius:6px; cursor:pointer; font-family:'Space Mono',monospace; font-weight:700; font-size:11px; transition: all .15s; }
.aspect-btn:hover { border-color:#3a3a44; }
.aspect-btn.active { background:rgba(0,245,160,0.1); border-color:#00F5A0; color:#00F5A0; }
.preview-caption { padding: 12px 16px; background: rgba(218,119,86,0.1); border-top: 1px solid var(--current-line); color: var(--current-fg); font-size: 11px; line-height: 1.5; text-align: center; }
.preview-caption small { color: var(--current-muted); font-size: 10px; }

/* Output format section — emphasized, sits at TOP of LEFT panel */
.section-title-top { font-size:13px; font-weight:900; color:#00F5A0; margin: 4px 0 10px; letter-spacing:0.5px; }
.output-format-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:24px; }
.of-card { padding:10px 12px; background:#0A0A0C; border:2px solid #26262c; border-radius:8px; cursor:pointer; transition: all .15s; }
.of-card:hover { border-color:#3a3a44; transform: translateY(-1px); }
.of-card.selected { border-color:#00F5A0; background:rgba(0,245,160,0.1); box-shadow: 0 0 0 1px rgba(0,245,160,0.3); }
.of-id { font-family:'Space Mono',monospace; font-size:9px; color:#00F5A0; font-weight:700; }
.of-name { font-size:12px; font-weight:800; color:#EDEDEF; margin: 2px 0 4px; }
.of-desc { font-size:10px; color:#8B8B92; line-height:1.3; }
.next-hint { font-size:10px; color:#8B8B92; margin: 0 0 8px 4px; padding-left: 8px; border-left: 2px solid #00F5A0; }

/* Demo overlay fix — keyframes for the per-letter JS demos */
@keyframes demo-letter-drop {
  from { transform: translateY(-30px); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}
@keyframes demo-letter-spring {
  from { transform: scale(0); }
  60%  { transform: scale(1.3); }
  to   { transform: scale(1); }
}

/* ===== Demo animations: containers ===== */
.demo-anim { display:inline-flex; align-items:center; justify-content:center; }

/* T5 fade */
@keyframes demo-fade { from { opacity: 0; } to { opacity: 1; } }
.demo-anim.demo-fade { animation: demo-fade 1s ease forwards; }

/* T6 slide-up */
@keyframes demo-slide-up { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.demo-anim.demo-slide-up { animation: demo-slide-up 1s ease forwards; }

/* T7 slide-left */
@keyframes demo-slide-left { from { transform: translateX(50px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.demo-anim.demo-slide-left { animation: demo-slide-left 1s ease forwards; }

/* T8 zoom-in */
@keyframes demo-zoom-in { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.demo-anim.demo-zoom-in { animation: demo-zoom-in 1s ease forwards; }

/* T9 zoom-out */
@keyframes demo-zoom-out { from { transform: scale(1.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.demo-anim.demo-zoom-out { animation: demo-zoom-out 1s ease forwards; }

/* T10 cut-hard (instant flash) */
@keyframes demo-cut-hard { 0% { opacity: 0; } 1% { opacity: 1; } 100% { opacity: 1; } }
.demo-anim.demo-cut-hard { animation: demo-cut-hard 0.6s steps(2) forwards; }

/* T15 scale-pop */
@keyframes demo-scale-pop { 0% { transform: scale(0); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
.demo-anim.demo-scale-pop { animation: demo-scale-pop 1s cubic-bezier(.34,1.56,.64,1) forwards; }

/* T16 rotate-in */
@keyframes demo-rotate-in { from { transform: rotate(-180deg) scale(0.5); opacity: 0; } to { transform: rotate(0) scale(1); opacity: 1; } }
.demo-anim.demo-rotate-in { animation: demo-rotate-in 1.2s ease forwards; }

/* T17 blur-focus */
@keyframes demo-blur-focus { from { filter: blur(20px); opacity: 0; } to { filter: blur(0); opacity: 1; } }
.demo-anim.demo-blur-focus { animation: demo-blur-focus 1.2s ease forwards; }

/* T19 mask-reveal */
@keyframes demo-mask-reveal { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
.demo-anim.demo-mask-reveal { animation: demo-mask-reveal 1.2s ease forwards; }

/* T20 elastic */
@keyframes demo-elastic { 0% { transform: scaleX(0); } 40% { transform: scaleX(1.3) scaleY(0.7); } 70% { transform: scaleX(0.85) scaleY(1.1); } 100% { transform: scale(1); } }
.demo-anim.demo-elastic { animation: demo-elastic 1.5s ease forwards; }

/* T21 glitch-rgb */
@keyframes demo-glitch-rgb {
  0%, 100% { text-shadow: none; transform: translate(0); }
  10% { text-shadow: -3px 0 #ff0080, 3px 0 #00f5a0; transform: translate(-2px,0); }
  20% { text-shadow: 3px 0 #ff0080, -3px 0 #00f5a0; transform: translate(2px,0); }
  30% { text-shadow: -2px 0 #00B4FF, 2px 0 #ff0080; transform: translate(0,1px); }
  50% { text-shadow: -4px 0 #ff0080, 4px 0 #00f5a0; transform: translate(-1px,0); }
  70% { text-shadow: 2px 0 #00B4FF, -2px 0 #ff0080; transform: translate(0,-1px); }
}
.demo-anim.demo-glitch-rgb { animation: demo-glitch-rgb 1.4s steps(20) forwards; }

/* T22 glitch-cut */
@keyframes demo-glitch-cut {
  0%, 100% { clip-path: inset(0 0 0 0); transform: translateX(0); }
  10% { clip-path: inset(20% 0 60% 0); transform: translateX(-6px); }
  20% { clip-path: inset(60% 0 10% 0); transform: translateX(6px); }
  30% { clip-path: inset(0 0 0 0); transform: translateX(0); }
  60% { clip-path: inset(40% 0 30% 0); transform: translateX(-3px); }
  75% { clip-path: inset(0 0 0 0); transform: translateX(0); }
}
.demo-anim.demo-glitch-cut { animation: demo-glitch-cut 1.4s steps(8) forwards; }

/* T25 sparkle */
@keyframes demo-sparkle {
  0%, 100% { filter: brightness(1) drop-shadow(0 0 0 #fff); }
  25% { filter: brightness(1.5) drop-shadow(0 0 8px #fff); }
  50% { filter: brightness(1.1) drop-shadow(0 0 4px var(--current-accent)); }
  75% { filter: brightness(1.4) drop-shadow(0 0 10px #fff); }
}
.demo-anim.demo-sparkle { animation: demo-sparkle 1.5s ease forwards; }

/* T26 light-leak */
@keyframes demo-light-leak {
  0% { background: radial-gradient(circle at -20% 50%, rgba(255,150,80,0.6), transparent 40%); opacity: 0; }
  50% { background: radial-gradient(circle at 50% 50%, rgba(255,150,80,0.8), transparent 50%); opacity: 1; }
  100% { background: radial-gradient(circle at 120% 50%, rgba(255,150,80,0.4), transparent 40%); opacity: 1; }
}
.demo-anim.demo-light-leak { position:relative; }
.demo-anim.demo-light-leak::after { content:''; position:absolute; inset:0; pointer-events:none; animation: demo-light-leak 1.6s ease forwards; mix-blend-mode: screen; }

/* T27 shake */
@keyframes demo-shake {
  0%, 100% { transform: translateX(0); }
  10% { transform: translateX(-8px) rotate(-1deg); }
  20% { transform: translateX(8px) rotate(1deg); }
  30% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  50% { transform: translateX(-4px) rotate(-0.5deg); }
  60% { transform: translateX(4px) rotate(0.5deg); }
  70% { transform: translateX(-2px); }
  80% { transform: translateX(2px); }
}
.demo-anim.demo-shake { animation: demo-shake 1s ease forwards; }

/* T28 morph-shape (border-radius morph) */
@keyframes demo-morph-shape {
  0% { border-radius: 50%; transform: scale(0.7); background: var(--current-accent); }
  50% { border-radius: 0%; transform: scale(1) rotate(45deg); background: var(--current-fg); }
  100% { border-radius: 8px; transform: scale(1) rotate(0deg); }
}
.demo-anim.demo-morph-shape { animation: demo-morph-shape 1.6s ease forwards; }

/* T30 color-wash */
@keyframes demo-color-wash {
  0% { filter: hue-rotate(0deg) saturate(1); }
  50% { filter: hue-rotate(180deg) saturate(2); }
  100% { filter: hue-rotate(360deg) saturate(1); }
}
.demo-anim.demo-color-wash { animation: demo-color-wash 1.6s ease forwards; }

/* T31 noise-grain */
@keyframes demo-noise-grain {
  0%, 100% { filter: contrast(1.1) brightness(1); }
  20% { filter: contrast(1.3) brightness(1.05); }
  40% { filter: contrast(1.1) brightness(0.95); }
  60% { filter: contrast(1.4) brightness(1.1); }
  80% { filter: contrast(1.2) brightness(0.9); }
}
.demo-anim.demo-noise-grain { position:relative; animation: demo-noise-grain 1.4s steps(14) forwards; }
.demo-anim.demo-noise-grain::after {
  content:''; position:absolute; inset:0; pointer-events:none;
  background-image: repeating-radial-gradient(circle at 0 0, rgba(255,255,255,0.04) 0, rgba(0,0,0,0.04) 1px, transparent 2px);
  mix-blend-mode: overlay; opacity: 0.6;
}

/* T32 crt-scanline */
@keyframes demo-crt-scanline {
  0% { background-position: 0 0; opacity: 0; }
  10% { opacity: 1; }
  100% { background-position: 0 100px; opacity: 1; }
}
.demo-anim.demo-crt-scanline { position:relative; }
.demo-anim.demo-crt-scanline::after {
  content:''; position:absolute; inset:0; pointer-events:none;
  background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.3) 2px, rgba(0,0,0,0.3) 4px);
  animation: demo-crt-scanline 1.5s linear forwards;
}

/* T34 lens-flare */
@keyframes demo-lens-flare {
  0% { background-position: -100% 50%; opacity: 0; }
  50% { opacity: 1; }
  100% { background-position: 200% 50%; opacity: 0; }
}
.demo-anim.demo-lens-flare { position:relative; }
.demo-anim.demo-lens-flare::after {
  content:''; position:absolute; inset:0; pointer-events:none;
  background: radial-gradient(circle at 50% 50%, rgba(255,255,200,0.8), transparent 30%);
  background-size: 60% 100%; background-repeat:no-repeat;
  animation: demo-lens-flare 1.6s ease forwards; mix-blend-mode: screen;
}

/* T35 ripple */
@keyframes demo-ripple {
  0% { transform: scale(0.95); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}
.demo-anim.demo-ripple { position:relative; animation: demo-ripple 1.4s ease forwards; }
.demo-anim.demo-ripple::after {
  content:''; position:absolute; inset:0; border-radius:50%; pointer-events:none;
  border: 2px solid var(--current-accent); opacity: 0;
  animation: demo-ripple-circle 1.4s ease forwards;
}
@keyframes demo-ripple-circle {
  0% { transform: scale(0.4); opacity: 1; }
  100% { transform: scale(1.6); opacity: 0; }
}

/* T37 camera-pan */
@keyframes demo-camera-pan {
  0% { transform: translateX(60px); }
  100% { transform: translateX(0); }
}
.demo-anim.demo-camera-pan { animation: demo-camera-pan 1.4s ease forwards; }

/* T38 camera-dolly */
@keyframes demo-camera-dolly {
  0% { transform: scale(0.7) translateZ(0); }
  100% { transform: scale(1) translateZ(0); }
}
.demo-anim.demo-camera-dolly { animation: demo-camera-dolly 1.6s cubic-bezier(.4,0,.2,1) forwards; }

/* T41 depth-zoom */
@keyframes demo-depth-zoom {
  0% { transform: scale(0.6); filter: blur(8px); }
  60% { transform: scale(1.1); filter: blur(0); }
  100% { transform: scale(1); filter: blur(0); }
}
.demo-anim.demo-depth-zoom { animation: demo-depth-zoom 1.4s ease forwards; }

/* T42 flip-3d */
@keyframes demo-flip-3d {
  0% { transform: perspective(600px) rotateY(0deg); }
  50% { transform: perspective(600px) rotateY(180deg); }
  100% { transform: perspective(600px) rotateY(360deg); }
}
.demo-anim.demo-flip-3d { animation: demo-flip-3d 1.6s ease forwards; }

/* T43 fold-paper */
@keyframes demo-fold-paper {
  0% { transform: perspective(800px) rotateX(-90deg); transform-origin: top; opacity: 0; }
  100% { transform: perspective(800px) rotateX(0deg); transform-origin: top; opacity: 1; }
}
.demo-anim.demo-fold-paper { animation: demo-fold-paper 1.4s ease forwards; }

/* T45 split-reveal */
@keyframes demo-split-reveal {
  0% { clip-path: inset(0 50% 0 50%); }
  100% { clip-path: inset(0 0 0 0); }
}
.demo-anim.demo-split-reveal { animation: demo-split-reveal 1.2s cubic-bezier(.6,0,.2,1) forwards; }

/* T46 whip-pan */
@keyframes demo-whip-pan {
  0% { transform: translateX(120px); filter: blur(12px); opacity: 0; }
  60% { transform: translateX(-10px); filter: blur(2px); opacity: 1; }
  100% { transform: translateX(0); filter: blur(0); opacity: 1; }
}
.demo-anim.demo-whip-pan { animation: demo-whip-pan 0.9s cubic-bezier(.5,0,.1,1) forwards; }

/* T48 ken-burns */
@keyframes demo-ken-burns {
  0% { transform: scale(1) translate(0, 0); }
  100% { transform: scale(1.18) translate(-4%, -2%); }
}
.demo-anim.demo-ken-burns { animation: demo-ken-burns 1.8s ease forwards; }

/* T49 stop-motion */
@keyframes demo-stop-motion {
  0% { transform: rotate(-3deg) translateY(0); opacity: 0; }
  20% { transform: rotate(2deg) translateY(-2px); opacity: 1; }
  40% { transform: rotate(-2deg) translateY(1px); }
  60% { transform: rotate(2deg) translateY(-1px); }
  80% { transform: rotate(-1deg) translateY(0); }
  100% { transform: rotate(0deg) translateY(0); opacity: 1; }
}
.demo-anim.demo-stop-motion { animation: demo-stop-motion 1.4s steps(7) forwards; }

/* T51 chromatic */

<!-- 비밀번호 변경: 아래 GATE_PW 값만 수정 (이 줄 주석 포함 그대로 유지) -->
<div id="entry-gate" style="position:fixed;inset:0;background:#0A0A0C;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Pretendard Variable',Pretendard,sans-serif;color:#fff;text-align:center;padding:32px">

  <input id="entry-pw" type="password" placeholder="비밀번호" autofocus autocomplete="off" style="background:#141418;border:2px solid #26262c;border-radius:8px;color:#fff;font-size:18px;padding:14px 20px;width:280px;outline:none;text-align:center;letter-spacing:0.1em;font-family:'Space Mono',monospace" />
  <button id="entry-go" style="margin-top:16px;background:#00F5A0;color:#0A0A0C;border:0;border-radius:8px;padding:14px 40px;font-size:16px;font-weight:800;cursor:pointer;letter-spacing:0.05em;font-family:'Pretendard Variable',Pretendard,sans-serif">들어가기 →</button>
  <div id="entry-err" style="color:#FF0080;font-size:13px;margin-top:16px;min-height:18px;font-weight:600"></div>
  <div style="position:absolute;bottom:32px;color:#3a3a44;font-size:11px;font-family:'Space Mono',monospace">© 2026 COMMME · Card News Builder</div>
</div>
<script>
(function(){
  // ⭐⭐⭐ 비밀번호 변경: 아래 GATE_PW 값만 바꿔주세요 ⭐⭐⭐
  const GATE_PW = '60000';
  const STORAGE_KEY = 'cardnews_entry_v1';
  const gate = document.getElementById('entry-gate');
  const input = document.getElementById('entry-pw');
  const btn = document.getElementById('entry-go');
  const err = document.getElementById('entry-err');
  // 이미 통과한 사용자: 게이트 즉시 제거 (재방문 자동 통과)
  if (localStorage.getItem(STORAGE_KEY) === 'passed') {
    gate.remove();
    return;
  }
  function tryEnter() {
    if (input.value === GATE_PW) {
      localStorage.setItem(STORAGE_KEY, 'passed');
      gate.style.transition = 'opacity 0.4s ease';
      gate.style.opacity = '0';
      setTimeout(() => gate.remove(), 400);
    } else {
      err.textContent = '비밀번호가 틀려요. 다시 시도해주세요.';
      input.value = '';
      input.focus();
      input.style.borderColor = '#FF0080';
      setTimeout(() => { input.style.borderColor = '#26262c'; }, 600);
    }
  }
  btn.addEventListener('click', tryEnter);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') tryEnter(); });
})();
</script>

<script id="app-logic">
const state = {

};

const SLOTS = ['cover', 'content', 'cta'];
const SLOT_LABELS = { cover: '커버', content: '내용', cta: 'CTA' };

// 결과물 비율 → 픽셀 매핑 (cardnews_final 스킬이 사용)
const ASPECT_MAP = {
  '1:1':  { w: 1080, h: 1080, label: '1:1 정사각 (1080×1080)' },
  '4:5':  { w: 1080, h: 1350, label: '4:5 인스타 캐러셀 (1080×1350)' },
  '9:16': { w: 1080, h: 1920, label: '9:16 Reels/Shorts (1080×1920)' },
  '16:9': { w: 1920, h: 1080, label: '16:9 가로 와이드 (1920×1080)' }
};
const ASPECTS = Object.keys(ASPECT_MAP);

function applyAspect(ratio) {
  const m = ASPECT_MAP[ratio];
  if (!m) return;
  document.documentElement.style.setProperty('--preview-aspect', `${m.w}/${m.h}`);
}

function setState(patch) {
  // Capture scroll positions BEFORE re-render — render() rebuilds innerHTML and resets scroll
  const SCROLL_IDS = ['panel-left', 'panel-center', 'panel-right'];
  const NESTED_SELECTORS = ['.motion-list', '.preset-grid', '.palette-chips'];
  const scrolls = {};
  SCROLL_IDS.forEach(id => {
    const el = document.getElementById(id);
    if (el) scrolls[id] = el.scrollTop;
  });
  // Capture nested scrollable containers (motion-list 등) by class+index
  const nestedScrolls = [];
  NESTED_SELECTORS.forEach(sel => {
    document.querySelectorAll(sel).forEach((el, idx) => {
      if (el.scrollTop > 0) nestedScrolls.push({ sel, idx, top: el.scrollTop });
    });
  });
  const winY = window.scrollY;

  Object.assign(state, patch);
  render();

  // Restore scroll positions so the user stays where they clicked
  SCROLL_IDS.forEach(id => {
    const el = document.getElementById(id);
    if (el && scrolls[id] !== undefined) el.scrollTop = scrolls[id];
  });
  // Restore nested scroll positions (motion-list 등)
  NESTED_SELECTORS.forEach(sel => {
    const els = document.querySelectorAll(sel);
    nestedScrolls.filter(s => s.sel === sel).forEach(s => {
      if (els[s.idx]) els[s.idx].scrollTop = s.top;
    });
  });
  window.scrollTo(0, winY);

  // Live-apply: 좌측 클릭(팔레트/프리셋/모션/비율/출력/슬롯) 즉시 우측 프리뷰 반영
  try { applyPreview(); } catch(e) { /* preview not ready on first render */ }
}

function getActiveSlot() {
  return state[state.activeSlot];
}

// Convenience: set preset in active slot
function setActivePreset(presetId) {

}

// Convenience: set motion in active slot
function setActiveMotion(motionId) {

// Additive byte-offset shade: each RGB channel += round(255 * offsetPct/100), clamped [0,255].
// NOT an HSL percentage — for dark colors small offsets lift visibly; for light colors they clip near white.
// Use small offsets (10~30) for "subtly lighter" derived colors like borders and muted text.
function shade(hex, offsetPct) {
  const h = hex.replace('#','');
  const num = parseInt(h, 16);
  const r = Math.min(255, Math.max(0, ((num >> 16) & 0xff) + Math.round(255 * offsetPct/100)));
  const g = Math.min(255, Math.max(0, ((num >> 8)  & 0xff) + Math.round(255 * offsetPct/100)));
  const b = Math.min(255, Math.max(0, (num         & 0xff) + Math.round(255 * offsetPct/100)));
  return '#' + ((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}

function applyPalette(paletteId) {
  const p = PALETTES.find(x => x.id === paletteId);
  if (!p) return;
  const root = document.documentElement.style;
  const c = p.colors;
  const last = c.length - 1;
  // For 3-color palettes [bg,accent,fg] using c[last-1] would collide with accent.
  // We derive muted as a darkened fg (visible on bg, distinct from accent).
  // Palettes with 4+ colors use the explicit c[last-1] as muted.
  const muted = (c.length >= 4) ? c[last - 1] : shade(c[last], -30);
  root.setProperty('--current-bg',     c[0]);
  root.setProperty('--current-accent', c[1]);
  root.setProperty('--current-fg',     c[last]);
  root.setProperty('--current-muted',  muted);
  root.setProperty('--current-line',   shade(c[0], 15));   // bg lifted +15 byte-units → subtle border
}

      <div class="next-hint" style="margin-top:8px">${ASPECT_MAP[state.aspect].label}</div>
    </div>
  `;

  // Output formats — rendered SECOND at top of LEFT panel for emphasis
  const outputFormats = MOTIONS.filter(m => OUTPUT_IDS.includes(m.id));
  const outputHTML = `
    <div class="section-title-top">📦 출력 포맷 (${outputFormats.length} / 60 모션)</div>
    <div class="output-format-grid">

          <div class="of-name">${m.name}</div>

        </div>`;
      }).join('')}
    </div>
    <div class="next-hint">→ 다음: 팔레트 선택</div>
  `;

  // Palette chips
  const paletteHTML = PALETTES.map(p => {
    const swatches = p.colors.map(c => `<div style="background:${c}"></div>`).join('');
    return `<div class="p-chip ${p.id===state.palette?'selected':''}" data-palette="${p.id}">
      <div class="p-chip-swatch">${swatches}</div>
      <div class="p-chip-info">
        <div class="p-chip-code">${p.id}</div>
        <div class="p-chip-name">${p.name}</div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('panel-left').innerHTML = `
    ${aspectHTML}
    ${outputHTML}
    <div class="section-title">🌈 팔레트 (${PALETTES.length})</div>
    <div class="palette-chips">${paletteHTML}</div>
    <div id="motion-list-mount"></div>
  `;

  document.querySelectorAll('#panel-left .aspect-btn').forEach(el => {
    el.addEventListener('click', () => setState({ aspect: el.dataset.aspect }));
  });
  document.querySelectorAll('#panel-left .of-card').forEach(el => {
    el.addEventListener('click', () => setState({ output: el.dataset.motion }));
  });
  document.querySelectorAll('.p-chip').forEach(el => {
    el.addEventListener('click', () => setState({ palette: el.dataset.palette }));
  });
}

function applyPreview() {
  state.applied = { ...state };
  const canvas = document.getElementById('preview-canvas');
  const slot   = getActiveSlot();
  const preset = PRESETS.find(p => p.id === slot.preset);
  const motion = MOTIONS.find(m => m.id === slot.motion);
  const demo   = MOTION_DEMOS[slot.motion] || { type:'none' };
  if (!preset || !canvas) return;

  // Reset canvas
  canvas.className = 'preview-canvas';
  canvas.innerHTML = '';

  // ALWAYS render the preset mini-mark first — it must persist.
  // Motion is applied as overlay/animation on top, never as replacement.
  canvas.innerHTML = `<div class="preview-content">${renderMiniMark(preset)}</div>`;
  canvas.style.fontSize = '1.5em';
  const content = canvas.querySelector('.preview-content');

  if (demo.type === 'animation') {
    // CSS animation runs on the existing preset content
    content.classList.add('demo-anim', demo.anim);
    // Force reflow so re-applying the same animation restarts it.
    void content.offsetWidth;
  } else if (demo.type === 'js') {
    // JS demo functions mutate existing content in place — they do NOT replace it
    if (typeof window[demo.fn] === 'function') {
      try { window[demo.fn](content); } catch (e) { console.warn('demo fn failed', demo.fn, e); }
    }
  } else if (demo.type === 'label') {
    // Output formats (M-1~M-4) don't apply visual effects to preview.
    // Their selection is already visible in: combo code, prompt textarea, LEFT panel highlight.
    // Preview just shows the static preset mini-mark — no caption overlay.
  } else { // 'none'
    canvas.insertAdjacentHTML('beforeend',
      `<div class="preview-caption">◌ 이 모션(<b>${motion ? motion.name : slot.motion}</b>)은 실시간 미리보기 불가<br><small>cardnews 스킬이 실제로 생성합니다</small></div>`);
  }
}

// ===== Sprint 6: JS-driven demo functions (Demo Overlay Fix) =====
// Each function MUST animate the existing preset content, not replace it.
// They locate the dominant text element via findMainTextEl() and mutate it.

// Helper: find the most prominent text element in the preview content.
// Picks the leaf element (no children) with the largest computed font-size.
function findMainTextEl(content) {
  let best = null;
  let bestSize = 0;
  content.querySelectorAll('*').forEach(el => {
    const text = el.textContent.trim();
    const hasOnlyText = el.children.length === 0 && text.length > 0;
    if (!hasOnlyText) return;
    const size = parseFloat(getComputedStyle(el).fontSize) || 0;
    if (size > bestSize) {
      best = el;
      bestSize = size;
    }
  });
  return best;
}

function demoTypewriter(content) {
  const target = findMainTextEl(content);
  if (!target) return;
  const fullText = target.textContent;
  target.textContent = '';
  let i = 0;
  const tick = () => {
    if (i <= fullText.length) {
      target.textContent = fullText.slice(0, i) + (i < fullText.length ? '|' : '');
      i++;
      setTimeout(tick, 50);
    } else {
      target.textContent = fullText;
    }
  };
  tick();
}

function demoWordByWord(content) {
  const target = findMainTextEl(content);
  if (!target) return;
  const fullText = target.textContent;
  let words = fullText.split(/\s+/).filter(s => s);
  // Fallback: 단어 1개(한국어 띄어쓰기 없는 텍스트, 짧은 라벨 등)면 글자 단위로 분리
  // → "중요한 한 마디", "VS", "GO" 같은 짧은 텍스트도 word-by-word 효과 보임
  if (words.length <= 1) {
    words = fullText.replace(/\s+/g, '').split('');
  }
  target.textContent = '';
  let i = 0;
  const tick = () => {
    if (i < words.length) {
      target.textContent = words.slice(0, i + 1).join(' ');
      i++;
      setTimeout(tick, 200);
    }
  };
  tick();
}

function demoLetterDrop(content) {
  const target = findMainTextEl(content);
  if (!target) return;
  const chars = [...target.textContent];
  target.innerHTML = chars.map((c, i) =>
    `<span style="display:inline-block;animation:demo-letter-drop 0.5s ease ${i * 60}ms backwards">${c === ' ' ? '&nbsp;' : c}</span>`
  ).join('');
}

function demoLetterSpring(content) {
  const target = findMainTextEl(content);
  if (!target) return;
  const chars = [...target.textContent];
  target.innerHTML = chars.map((c, i) =>
    `<span style="display:inline-block;animation:demo-letter-spring 0.7s cubic-bezier(0.5,1.5,0.5,1) ${i * 50}ms backwards">${c === ' ' ? '&nbsp;' : c}</span>`
  ).join('');
}

function demoScramble(content) {
  const target = findMainTextEl(content);
  if (!target) return;
  const final = target.textContent;
  const chars = '!@#$%^&*ABCDEFGHIJKLMNOPQRSTUVWXYZ가나다라마바사아자차카타파하';
  let frame = 0;
  const total = 20;
  const tick = () => {
    if (frame < total) {
      const ratio = frame / total;
      target.textContent = [...final].map((c, i) =>
        i / final.length < ratio ? c : chars[Math.floor(Math.random() * chars.length)]
      ).join('');
      frame++;
      setTimeout(tick, 50);
    } else {
      target.textContent = final;
    }
  };
  tick();
}

function demoMorphNumber(content) {
  const target = findMainTextEl(content);
  if (!target) return;
  const finalNum = parseInt(target.textContent, 10);
  if (isNaN(finalNum)) return;  // not a number — skip silently
  let frame = 0;
  const total = 30;
  const tick = () => {
    frame++;
    const curr = Math.round((frame / total) * finalNum);
    target.textContent = curr;
    if (frame < total) setTimeout(tick, 40);
    else target.textContent = finalNum;
  };
  tick();
}

// Expose to window for dispatch by name
window.demoTypewriter   = demoTypewriter;
window.demoWordByWord   = demoWordByWord;
window.demoLetterDrop   = demoLetterDrop;
window.demoLetterSpring = demoLetterSpring;
window.demoScramble     = demoScramble;
window.demoMorphNumber  = demoMorphNumber;

function copyPrompt() {
  const ta = document.getElementById('prompt-text');
  navigator.clipboard.writeText(ta.value).then(() => {
    const btn = document.getElementById('btn-copy');
    btn.classList.add('copied');
    btn.textContent = '✓ 복사됨';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.textContent = '📋 복사';
    }, 1500);
  });
}

  renderHeader();
  applyPalette(state.palette);
  applyAspect(state.aspect);
  renderPaletteChips();
  renderMotionList();
  renderPresetGrid();

}
